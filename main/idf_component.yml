dependencies:
  # Both panel driver components are listed unconditionally: which one
  # actually gets used is decided at compile time in main/board_config.h
  # (component fetching happens before the preprocessor runs, so the
  # unused driver just isn't referenced from lcd.c).
  espressif/esp_lcd_ili9341: "^2.0.2"
  espressif/esp_lcd_st7796: "^1.4.0"
  atanisoft/esp_lcd_touch_xpt2046: "^1.0.6"
  espressif/esp_lvgl_port: "^2.7.2"
  lvgl/lvgl: "^9.5.0"

  idf:
    version: ">=6.0.0"
